name: Assignment Portal CI

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  automated-tests:
    name: Run Tests and Deliver Report
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Installed Python
        run: |
          python --version
          python -m pip --version

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Execute Pytest Suite
        id: pytest
        run: |
          python -m pytest -v --json-report --json-report-file=test-results.json

      - name: Deliver Report to Local Computer
        if: always()
        env:
          REPORT_RECEIVER_URL: http://127.0.0.1:8765/report
          REPORT_RECEIVER_TOKEN: ${{ secrets.REPORT_RECEIVER_TOKEN }}
          TEST_STEP_OUTCOME: ${{ steps.pytest.outcome }}
        run: |
          python receiver/send_report.py

      - name: Generate Runner Email Report
        if: always()
        env:
          TEST_STEP_OUTCOME: ${{ steps.pytest.outcome }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python receiver/send_report.py

      - name: Send Email Report
        if: always()
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
        run: |
          python receiver/email_report.py

  deploy-pages:
    name: Deploy Static Portal
    needs: automated-tests
    if: success() && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Static Website
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/static

      - name: Deploy Website
        id: deployment
        uses: actions/deploy-pages@v4